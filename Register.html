
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYBE - Create Account</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f3ff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.card {
  background: white;
  width: 100%;
  max-width: 380px;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #0001;
}
h1 { color: #7545dc; text-align: center; }
p { color: #777; text-align: center; }
input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: #7545dc;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
a { color: #7545dc; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>VYBE</h1>
  <p>Create your account</p>

  <form id="registerForm">
    <input id="username" placeholder="Choose a username" required>
    <input id="password" type="password" placeholder="Create password" required>
    <input id="confirm" type="password" placeholder="Confirm password" required>
    <button type="submit">Create Account</button>
  </form>

  <p>Already have an account? <a href="Login.html">Log in</a></p>
</div>

<script>
fetch("/supabase.js")
  .then(response => {
    alert("File status: " + response.status);
  })
  .catch(error => {
    alert("Fetch error: " + error.message);
  });
</script>

</body>
</html>
