
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYBE - Create Account</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f3ff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.card {
  background: white;
  width: 100%;
  max-width: 380px;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #0001;
}
h1 { color: #7545dc; text-align: center; }
p { color: #777; text-align: center; }
input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: #7545dc;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
a { color: #7545dc; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>VYBE</h1>
  <p>Create your account</p>

  <form id="registerForm">
    <input id="username" placeholder="Choose a username" required>
    <input id="password" type="password" placeholder="Create password" required>
    <input id="confirm" type="password" placeholder="Confirm password" required>
    <button type="submit">Create Account</button>
  </form>

  <p>Already have an account? <a href="Login.html">Log in</a></p>
</div>

<script type="module">
import { supabase } from "./supabase.js";

async function createAccount(event) {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (username.length < 3) {
    alert("Username must be at least 3 characters.");
    return;
  }

  if (password.length < 8) {
    alert("Password must be at least 8 characters.");
    return;
  }

  if (password !== confirm) {
    alert("Passwords do not match!");
    return;
  }

  try {
    const { data, error } = await supabase.functions.invoke("auth", {
      body: {
        action: "register",
        username: username,
        password: password
      }
    });

    if (error) throw error;

    if (!data || !data.session) {
      throw new Error("Registration did not return a login session.");
    }

    const { error: sessionError } = await supabase.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token
    });

    if (sessionError) throw sessionError;

    alert("Welcome to VYBE! Your account has been created.");
    window.location.href = "index.html";

  } catch (error) {
    alert("Registration error: " + error.message);
  }
}

document.getElementById("registerForm").addEventListener("submit", createAccount);
      </script>

</body>
</html>
